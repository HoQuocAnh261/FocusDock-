<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background App Rounded Tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="6"/>

  <!-- Background Track Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="24"/>

  <!-- Glowing Active Pomodoro Arc -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="24" stroke-linecap="round" stroke-dasharray="1005.3" stroke-dashoffset="250" filter="url(#glow)"/>

  <!-- Ambient Sound Waves in the Center -->
  <g fill="none" stroke="#f8fafc" stroke-linecap="round" stroke-width="12">
    <!-- Center Wave Bars -->
    <line x1="176" y1="230" x2="176" y2="282" stroke="#38bdf8" opacity="0.75"/>
    <line x1="216" y1="200" x2="216" y2="312" stroke="#60a5fa" opacity="0.9"/>
    <line x1="256" y1="176" x2="256" y2="336" stroke="#ffffff" />
    <line x1="296" y1="200" x2="296" y2="312" stroke="#818cf8" opacity="0.9"/>
    <line x1="336" y1="230" x2="336" y2="282" stroke="#a78bfa" opacity="0.75"/>
  </g>

  <!-- Dial Tick Marker Top -->
  <circle cx="256" cy="96" r="10" fill="#38bdf8" filter="url(#glow)"/>
</svg>
